<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your Phoenix Shop account.">
    <title>Phoenix Shop Sign-In</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

    <div class="auth-wrapper">


        <header class="auth-header">
            <a href="../index.html" class="auth-logo" aria-label="Phoenix Shop home">
                <img src="../image/logo.jpg" alt="Phoenix Shop">
            </a>
        </header>


        <main class="auth-box">
            <h1 class="auth-title">Sign in or create account</h1>

            <form class="auth-form" action="#" method="post" autocomplete="on" novalidate>
                <label for="email" class="auth-label">Enter mobile number or email</label>
                <input type="text" id="email" name="email" class="auth-input" autocomplete="username" required
                    maxlength="100" autofocus>

                <button type="submit" class="auth-btn">Continue</button>
            </form>

            <p class="auth-legal">
                By continuing, you agree to Phoenix Shop's
                <a href="terms.html">Conditions of Use</a> and
                <a href="privacy.html">Privacy Notice</a>.
            </p>

            <a href="help-support.html" class="auth-help">Need help?</a>

            <hr class="auth-divider">

            <div class="auth-business">
                <h2 class="auth-business-title">Selling on Phoenix?</h2>
                <a href="signup.html" class="auth-business-link">Create a free seller account</a>
            </div>
        </main>

    </div>

    <footer class="auth-footer">
        <ul class="auth-footer-links">
            <li><a href="terms.html">Conditions of Use</a></li>
            <li><a href="privacy.html">Privacy Notice</a></li>
            <li><a href="help-support.html">Help</a></li>
        </ul>
        <p class="auth-copyright">&copy; 2026, Phoenix Shop or its affiliates</p>
    </footer>

</body>

</html>
